paths:
  videos: "data/videos"
  audio_chunks: "data/audio_chunks"
  transcripts: "data/transcripts"
  outputs: "data/outputs"

models:
  whisper: "small"
  keyword_encoder: "models/keyword_encoder"

chunking:
  audio_chunk_seconds: 30
  transcript_chunk_words: 300

tags:
  max_tags: 10
  min_score: 0.45

llm:
  provider: "openrouter"
  model: "openai/gpt-4o"
  temperature: 0.3
  max_tokens: 1024
